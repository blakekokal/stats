:root{
  --bg:#f1f4f2; --panel:#ffffff; --fg:#17201b; --muted:#5d6b63; --line:#d6dfd9;
  --accent:#047a52; --accent-soft:#e2f2ea; --stage:#c9d3cd;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"BarlowLogo","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613; --panel:#1a211d; --fg:#e7eee9; --muted:#9aa9a0; --line:#2c3630;
  --accent:#3fcf85; --accent-soft:#1d3328; --stage:#2a332e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --panel:#1a211d; --fg:#e7eee9; --muted:#9aa9a0; --line:#2c3630;
  --accent:#3fcf85; --accent-soft:#1d3328; --stage:#2a332e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}}
h1{font-family:var(--display);font-weight:900;font-size:2rem;letter-spacing:.01em;margin:0 0 4px;text-transform:uppercase}
.sub{color:var(--muted);margin:0 0 16px;line-height:1.45}
.stage{background:var(--stage);border-radius:20px;padding:clamp(12px,4vw,36px);display:flex;justify-content:center}
canvas#c{width:100%;max-width:560px;aspect-ratio:1;border-radius:22.5%;touch-action:none;cursor:grab;display:block;box-shadow:0 6px 24px rgba(0,0,0,.18)}
canvas#c.dragging{cursor:grabbing}
.sizes{display:flex;gap:16px;align-items:flex-end;margin-top:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.sizes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.sizes canvas{border-radius:22.5%;display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--fg);font:600 14px var(--ui);padding:9px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row{display:grid;grid-template-columns:70px minmax(0,1fr) 52px;gap:10px;align-items:center}
.row label{font-size:13px;color:var(--muted)}
.row output{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.group{display:flex;flex-direction:column;gap:10px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 13px var(--ui);padding:9px 12px;border-radius:9px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1a13}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1a13}}
.btn:focus-visible,.seg button:focus-visible,.swatches button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:96px;font:12px ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.toast{font-size:12.5px;color:var(--accent);min-height:1em}
</style>

<div class="wrap">
  <div>
    <h1>BKG Logo Builder</h1>
    <p class="sub">Drag the hat or the letters to move them. Drag the round handle above the selected one to turn it. Fine-tune with the sliders.</p>
    <div class="stage"><canvas id="c" width="1024" height="1024" aria-label="Logo preview: drag to move, handle to rotate"></canvas></div>
    <div class="sizes">
      <figure><canvas id="s180" width="180" height="180" style="width:90px;height:90px"></canvas><figcaption>Home screen</figcaption></figure>
      <figure><canvas id="s64" width="64" height="64" style="width:40px;height:40px"></canvas><figcaption>Small</figcaption></figure>
      <figure><canvas id="s32" width="32" height="32" style="width:20px;height:20px;border-radius:4px"></canvas><figcaption>Tab</figcaption></figure>
    </div>
  </div>

  <div class="panel">
    <div class="seg" role="group" aria-label="What to adjust">
      <button id="selHat" aria-pressed="true">Hat</button>
      <button id="selTxt" aria-pressed="false">Letters</button>
    </div>
    <div class="group">
      <div class="row"><label for="rot">Turn</label><input id="rot" type="range" min="-45" max="45" step="0.5"><output id="rotO"></output></div>
      <div class="row"><label for="size">Size</label><input id="size" type="range" min="20" max="160" step="1"><output id="sizeO"></output></div>
      <div class="row"><label for="px">Left/right</label><input id="px" type="range" min="0" max="1024" step="1"><output id="pxO"></output></div>
      <div class="row"><label for="py">Up/down</label><input id="py" type="range" min="0" max="1024" step="1"><output id="pyO"></output></div>
      <div class="row" id="widthRow" hidden><label for="wid">Width</label><input id="wid" type="range" min="60" max="160" step="1"><output id="widO"></output></div>
    </div>
    <div class="group">
      <span class="label">Letter colour</span>
      <div class="swatches" id="txtCols"></div>
      <span class="label">Background</span>
      <div class="swatches" id="bgCols"></div>
      <label class="check"><input type="checkbox" id="glow" checked> White glow around the hat</label>
    </div>
    <div class="btns">
      <button class="btn" id="reset">Start over</button>
      <button class="btn" id="front">Hat in front</button>
    </div>
    <div class="group">
      <span class="label">Send me this</span>
      <textarea id="out" readonly aria-label="Logo settings"></textarea>
      <div class="btns"><button class="btn primary" id="copy">Copy settings</button></div>
      <div class="toast" id="toast" role="status"></div>
      <p class="hint">Paste these settings back in the chat and I'll build the app icon from them at full size.</p>
    </div>
  </div>
</div>

const DEFAULT={hat:{x:535,y:412,rot:-3,size:100},text:{x:512,y:690,rot:0,size:300,width:100,color:"#2fbf71"},bg:"#ffffff",glow:true,hatFront:true};
let st=JSON.parse(JSON.stringify(DEFAULT));
try{const s=localStorage.getItem("bkg-logo");if(s)st=Object.assign(st,JSON.parse(s));}catch(e){}
let sel="hat";
const c=document.getElementById("c"),ctx=c.getContext("2d");
const hat=new Image(); hat.src=HAT_SRC;
const off=document.createElement("canvas"),octx=off.getContext("2d");
const glowC=document.createElement("canvas"),gctx=glowC.getContext("2d");

function hatDims(){const k=st.hat.size/100;return {w:HAT_W*k,h:HAT_H*k};}
function textMetrics(g){
  g.font=`900 400px BarlowLogo`;
  const m=g.measureText("BKG");
  const cap=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
  const k=st.text.size/cap; const w=(m.actualBoundingBoxLeft+m.actualBoundingBoxRight)*k*st.text.width/100;
  return {m,k,w,h:st.text.size};
}
function drawText(g){
  const {m,k}=textMetrics(g);
  g.save(); g.translate(st.text.x,st.text.y); g.rotate(st.text.rot*Math.PI/180);
  g.scale(k*st.text.width/100,k);
  const bw=m.actualBoundingBoxLeft+m.actualBoundingBoxRight, bh=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
  g.fillStyle=st.text.color; g.textBaseline="alphabetic";
  g.fillText("BKG",-bw/2+m.actualBoundingBoxLeft,-bh/2+m.actualBoundingBoxAscent);
  g.restore();
}
function drawHat(g){
  const {w,h}=hatDims();
  if(st.glow){
    const pad=30; glowC.width=Math.ceil(w+pad*2); glowC.height=Math.ceil(h+pad*2);
    gctx.clearRect(0,0,glowC.width,glowC.height);
    for(let a=0;a<360;a+=20){const r=9;gctx.drawImage(hat,pad+r*Math.cos(a*Math.PI/180),pad+r*Math.sin(a*Math.PI/180),w,h);}
    gctx.globalCompositeOperation="source-in"; gctx.fillStyle=st.bg; gctx.fillRect(0,0,glowC.width,glowC.height); gctx.globalCompositeOperation="source-over";
  }
  g.save(); g.translate(st.hat.x,st.hat.y); g.rotate(st.hat.rot*Math.PI/180);
  if(st.glow){g.filter="blur(2px)";g.drawImage(glowC,-w/2-30,-h/2-30);g.filter="none";}
  g.drawImage(hat,-w/2,-h/2,w,h); g.restore();
}
function render(g,size,ui){
  g.save(); g.setTransform(size/1024,0,0,size/1024,0,0);
  g.fillStyle=st.bg; g.fillRect(0,0,1024,1024);
  if(st.hatFront){drawText(g);drawHat(g);} else {drawHat(g);drawText(g);}
  if(ui) drawSel(g);
  g.restore();
}
function bounds(){
  if(sel==="hat"){const {w,h}=hatDims();return {x:st.hat.x,y:st.hat.y,w,h,rot:st.hat.rot};}
  const t=textMetrics(ctx);return {x:st.text.x,y:st.text.y,w:t.w,h:t.h,rot:st.text.rot};
}
function handlePos(b){const r=b.rot*Math.PI/180,d=b.h/2+60;return {x:b.x+Math.sin(r)*d,y:b.y-Math.cos(r)*d};}
function drawSel(g){
  const b=bounds(),acc=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#047a52";
  g.save(); g.translate(b.x,b.y); g.rotate(b.rot*Math.PI/180);
  g.strokeStyle=acc; g.lineWidth=4; g.setLineDash([14,10]); g.strokeRect(-b.w/2-8,-b.h/2-8,b.w+16,b.h+16);
  g.setLineDash([]); g.beginPath(); g.moveTo(0,-b.h/2-8); g.lineTo(0,-b.h/2-60); g.stroke();
  g.fillStyle="#fff"; g.beginPath(); g.arc(0,-b.h/2-60,20,0,7); g.fill(); g.stroke();
  g.restore();
}
function draw(){
  render(ctx,1024,true);
  for(const id of ["s180","s64","s32"]){const k=document.getElementById(id);render(k.getContext("2d"),k.width,false);}
  sync(); try{localStorage.setItem("bkg-logo",JSON.stringify(st));}catch(e){}
}
const obj=()=>sel==="hat"?st.hat:st.text;
function sync(){
  const o=obj();
  const set=(id,v,txt)=>{document.getElementById(id).value=v;document.getElementById(id+"O").textContent=txt;};
  set("rot",o.rot,(o.rot>0?"+":"")+o.rot+"°");
  if(sel==="hat"){const s=document.getElementById("size");s.min=40;s.max=160;set("size",o.size,o.size+"%");}
  else{const s=document.getElementById("size");s.min=80;s.max=600;set("size",o.size,o.size+"px");}
  set("px",Math.round(o.x),Math.round(o.x)); set("py",Math.round(o.y),Math.round(o.y));
  document.getElementById("widthRow").hidden=sel!=="text";
  set("wid",st.text.width,st.text.width+"%");
  document.getElementById("selHat").setAttribute("aria-pressed",sel==="hat");
  document.getElementById("selTxt").setAttribute("aria-pressed",sel==="text");
  document.getElementById("front").textContent=st.hatFront?"Put letters in front":"Put hat in front";
  document.getElementById("glow").checked=st.glow;
  for(const [box,key] of [["txtCols",st.text.color],["bgCols",st.bg]])
    for(const b of document.getElementById(box).children) b.setAttribute("aria-pressed",b.dataset.c===key);
  const r=v=>Math.round(v*10)/10;
  document.getElementById("out").value="BKG logo settings\n"+JSON.stringify({hat:{x:r(st.hat.x),y:r(st.hat.y),turn:st.hat.rot,size:st.hat.size},
    letters:{x:r(st.text.x),y:r(st.text.y),turn:st.text.rot,height:st.text.size,width:st.text.width,color:st.text.color},
    background:st.bg,glow:st.glow,hatInFront:st.hatFront});
}
function mk(box,list,fn){const el=document.getElementById(box);for(const [n,v] of list){const b=document.createElement("button");b.style.background=v;b.dataset.c=v;b.title=n;b.setAttribute("aria-label",n);b.onclick=()=>{fn(v);draw();};el.appendChild(b);}}
mk("txtCols",COLS.text,v=>st.text.color=v); mk("bgCols",COLS.bg,v=>st.bg=v);
for(const id of ["rot","size","px","py","wid"]) document.getElementById(id).addEventListener("input",e=>{
  const v=+e.target.value,o=obj();
  if(id==="rot")o.rot=v; if(id==="size")o.size=v; if(id==="px")o.x=v; if(id==="py")o.y=v; if(id==="wid")st.text.width=v; draw();});
document.getElementById("selHat").onclick=()=>{sel="hat";draw();};
document.getElementById("selTxt").onclick=()=>{sel="text";draw();};
document.getElementById("glow").onchange=e=>{st.glow=e.target.checked;draw();};
document.getElementById("front").onclick=()=>{st.hatFront=!st.hatFront;draw();};
document.getElementById("reset").onclick=()=>{st=JSON.parse(JSON.stringify(DEFAULT));draw();};
document.getElementById("copy").onclick=async()=>{
  const t=document.getElementById("out"),toast=document.getElementById("toast");
  try{await navigator.clipboard.writeText(t.value);toast.textContent="Copied. Paste it in the chat.";}
  catch(e){t.focus();t.select();toast.textContent="Selected. Press Ctrl+C or Cmd+C to copy.";}
};
// pointer: hit test
function toLocal(p,b){const r=-b.rot*Math.PI/180,dx=p.x-b.x,dy=p.y-b.y;return {x:dx*Math.cos(r)-dy*Math.sin(r),y:dx*Math.sin(r)+dy*Math.cos(r)};}
function inBox(p,b,m=0){const l=toLocal(p,b);return Math.abs(l.x)<=b.w/2+m&&Math.abs(l.y)<=b.h/2+m;}
function hatHit(p){
  const k=st.hat.size/100,b={x:st.hat.x,y:st.hat.y,w:HAT_W*k,h:HAT_H*k,rot:st.hat.rot};
  if(!inBox(p,b))return false;
  const l=toLocal(p,b),px=Math.floor((l.x+b.w/2)/k),py=Math.floor((l.y+b.h/2)/k);
  octx.clearRect(0,0,1,1); octx.drawImage(hat,px,py,1,1,0,0,1,1); return octx.getImageData(0,0,1,1).data[3]>20;
}
off.width=1;off.height=1;
let drag=null;
function pt(e){const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*1024/r.width,y:(e.clientY-r.top)*1024/r.height};}
c.addEventListener("pointerdown",e=>{
  const p=pt(e),b=bounds(),h=handlePos(b);
  if(Math.hypot(p.x-h.x,p.y-h.y)<40){drag={mode:"rot"};}
  else{
    const tb=(()=>{const t=textMetrics(ctx);return {x:st.text.x,y:st.text.y,w:t.w,h:t.h,rot:st.text.rot};})();
    const onHat=hatHit(p),onTxt=inBox(p,tb,10);
    if(onHat&&(st.hatFront||!onTxt))sel="hat"; else if(onTxt)sel="text"; else if(onHat)sel="hat"; else {draw();return;}
    const o=obj(); drag={mode:"move",dx:p.x-o.x,dy:p.y-o.y};
  }
  c.setPointerCapture(e.pointerId); c.classList.add("dragging"); draw();
});
c.addEventListener("pointermove",e=>{
  if(!drag)return; const p=pt(e),o=obj();
  if(drag.mode==="move"){o.x=Math.round(p.x-drag.dx);o.y=Math.round(p.y-drag.dy);}
  else{let a=Math.atan2(p.x-o.x,-(p.y-o.y))*180/Math.PI; a=Math.round(a*2)/2; if(e.shiftKey)a=Math.round(a/5)*5; o.rot=Math.max(-45,Math.min(45,a));}
  draw();
});
const end=()=>{drag=null;c.classList.remove("dragging");};
c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
c.tabIndex=0;
c.addEventListener("keydown",e=>{const o=obj(),s=e.shiftKey?10:1;
  if(e.key==="ArrowLeft")o.x-=s; else if(e.key==="ArrowRight")o.x+=s; else if(e.key==="ArrowUp")o.y-=s; else if(e.key==="ArrowDown")o.y+=s;
  else if(e.key==="["||e.key===",")o.rot-=0.5; else if(e.key==="]"||e.key===".")o.rot+=0.5; else return; e.preventDefault(); draw();});
Promise.all([hat.decode(),document.fonts.load("900 100px BarlowLogo")]).then(draw,draw);
</script>
