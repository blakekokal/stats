<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Shot Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/geoman/leaflet-geoman.css">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/coach.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<nav id="nav">
  <a href="#/" data-tab="home">Home</a>
  <a href="#/stats" data-tab="stats">Stats</a>
  <a href="#/course" data-tab="course">Course</a>
  <a href="#/settings" data-tab="settings">Settings</a>
  <a href="#/account" data-tab="account" id="account-link"><span id="sync-dot" title="Sync status"></span><span id="account-name">Log in</span></a>
</nav>
<main id="view"></main>
<div id="toast" role="status"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/geoman/leaflet-geoman.js"></script>
<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script type="module" src="js/app.js"></script>
<script>
// If the app has not started after a few seconds (usually a stale cached file
// after an update), offer a reload that clears the cached copies first.
setTimeout(function () {
  if (document.getElementById('view').children.length) return;
  var v = document.getElementById('view');
  v.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#fff;font:16px system-ui,sans-serif">'
    + '<p style="margin:0 0 16px">The app did not load properly, probably because of an old saved copy.</p>'
    + '<button id="fixreload" style="font:700 16px system-ui;padding:12px 22px;border:0;border-radius:12px;background:#007a52;color:#fff">Reload app</button></div>';
  document.getElementById('fixreload').onclick = function () {
    var jobs = [];
    if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('shell-') === 0; }).map(function (k) { return caches.delete(k); })); }));
    if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now() + location.hash); });
  };
}, 6000);
</script>
</body>
</html>
